version: '3.8'

services:
  # Ollama service for AI model
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # RK3588 Rock 5B: Runs on CPU (ARM64)
    # Note: llama3.1 will be slower on CPU-only
    # For smaller/faster models, consider using llama3.2:1b or qwen2.5:0.5b
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # For NVIDIA GPU support (not applicable to RK3588), uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Model puller - runs once to pull the model
  ollama-puller:
    image: alpine:latest
    container_name: ollama-puller
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl
        echo 'Waiting for Ollama to be ready...'
        until curl -s http://ollama:11434/api/tags > /dev/null 2>&1; do
          echo 'Ollama is unavailable - sleeping'
          sleep 3
        done
        echo 'Ollama is ready - pulling qwen2.5:0.5b model...'
        echo 'This may take several minutes on first run...'
        curl -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d '{"name":"qwen2.5:0.5b"}'
        echo 'Model pulled successfully!'
        echo 'Warming up model (first inference)...'
        curl -X POST http://ollama:11434/api/generate \
          -H 'Content-Type: application/json' \
          -d '{"model":"qwen2.5:0.5b","prompt":"Hello","stream":false}' > /dev/null
        echo 'Model is ready for use!'

  # Discord AI Bot
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-ai-bot
    depends_on:
      ollama-puller:
        condition: service_completed_successfully
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
    env_file:
      - .env
    volumes:
      # Mount config for easy updates without rebuild
      - ./config.js:/app/config.js:ro
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
